<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시글 상세 - RECHARGETECH</title>
    <style>
        :root {
            --ink:#101b30;
            --muted:#647990;
            --blue:#007fba;
            --line:#d8e9fb;
            --bg:#f1f6fb;
            --pale:#f5f9fc;
            --grad:linear-gradient(115deg,#0ca4df,#2465e9);
        }

        * {
            box-sizing:border-box;
        }

        body {
            margin:0;
            background:var(--bg);
            color:var(--ink);
            font:14px/1.55 "Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
        }

        a {
            color:inherit;
            text-decoration:none;
        }

        button,input,select,textarea {
            font:inherit;
        }

        button {
            cursor:pointer;
        }

        button:disabled {
            cursor:not-allowed;
            opacity:.55;
        }

        a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible {
            outline:3px solid #76c8f2;
            outline-offset:2px;
        }

        .site-header {
            background:white;
            border-bottom:1px solid #d7e9fa;
            box-shadow:0 2px 12px #487dae08;
        }

        .header-inner {
            max-width:1040px;
            min-height:65px;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:18px;
        }

        .brand {
            display:flex;
            align-items:center;
            gap:10px;
            white-space:nowrap;
        }

        .brand-icon {
            width:38px;
            height:38px;
            flex:none;
        }

        .brand strong {
            display:block;
            color:#006a9f;
            font-size:18px;
            font-weight:900;
            letter-spacing:-.6px;
            line-height:1.2;
        }

        .brand small {
            display:block;
            color:var(--muted);
            font-size:11px;
            margin-top:4px;
        }

        .main-nav,.auth,.actions,.search-form,.vote-row,.comment-actions,.form-actions {
            display:flex;
            align-items:center;
            gap:8px;
            flex-wrap:wrap;
        }

        .main-nav {
            gap:9px;
        }

        .main-nav a,.main-nav span {
            padding:9px 15px;
            font-weight:700;
            color:#35475c;
            border-radius:8px;
            white-space:nowrap;
        }

        .main-nav .active,.main-nav a:hover {
            background:#dff1fc;
            color:#006d9f;
        }

        .btn {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:5px;
            min-height:36px;
            padding:8px 14px;
            border:1px solid #b9e3fc;
            background:#e2f3fd;
            color:#006eaa;
            border-radius:7px;
            font-weight:700;
            white-space:nowrap;
            font-size:13px;
        }

        .btn:hover {
            filter:brightness(.97);
        }

        .btn-primary {
            background:var(--grad);
            color:white;
            border-color:#237cea;
            box-shadow:0 3px 8px #167be018;
        }

        .btn-outline {
            background:white;
            border-color:#8fd4fb;
        }

        .btn-quiet {
            background:white;
            border-color:#d7e5f1;
            color:#536980;
        }

        .btn-danger {
            background:#fff5f5;
            border-color:#ffd0d0;
            color:#bd3d3d;
        }

        .btn-sm {
            min-height:30px;
            padding:4px 10px;
            font-size:12px;
        }

        .container {
            max-width:1040px;
            margin:32px auto 60px;
        }

        .card {
            background:white;
            border:1px solid #dcecfb;
            border-radius:16px;
            padding:28px;
            box-shadow:0 6px 24px #355a8410;
        }

        .heading {
            text-align:center;
            margin:0 0 25px;
        }

        .heading h1 {
            font-size:24px;
            margin:0 0 8px;
            letter-spacing:-.7px;
        }

        .heading p {
            margin:0;
            color:var(--muted);
            font-size:14px;
        }

        .toolbar {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
            margin:0 0 15px;
        }

        .count {
            color:var(--muted);
        }

        .count strong {
            color:#0087c5;
        }

        .field,select,input[type=text],textarea {
            border:1px solid #cfdeed;
            border-radius:7px;
            background:#fff;
            color:var(--ink);
            padding:9px 12px;
            min-height:38px;
        }

        input::placeholder,textarea::placeholder {
            color:#94a4b6;
        }

        .search-form input {
            width:210px;
        }

        .table-wrap {
            overflow-x:auto;
            border:1px solid var(--line);
            border-radius:10px;
        }

        .board-table {
            border-collapse:collapse;
            width:100%;
            min-width:690px;
            table-layout:fixed;
        }

        .board-table th {
            background:#f1f7fc;
            color:#415970;
            font-weight:700;
            padding:13px 8px;
            text-align:center;
            border-bottom:1px solid var(--line);
        }

        .board-table td {
            padding:15px 8px;
            border-bottom:1px solid #e7eff6;
            text-align:center;
            color:#51677c;
            font-size:13px;
        }

        .board-table tr:last-child td {
            border-bottom:none;
        }

        .board-table tbody tr:hover {
            background:#f7fbff;
        }

        .board-table .title-cell {
            text-align:left;
            color:var(--ink);
            font-size:14px;
            overflow-wrap:anywhere;
        }

        .title-cell a:hover {
            color:#0084c8;
            text-decoration:underline;
        }

        .reply-count {
            color:#0088c8;
            font-weight:700;
            margin-left:4px;
            font-size:12px;
        }

        .tag {
            display:inline-block;
            background:#dff1fc;
            color:#0075af;
            padding:4px 10px;
            border-radius:20px;
            font-size:12px;
            font-weight:700;
            white-space:nowrap;
        }

        .tag-notice {
            background:#fff0f0;
            color:#da4444;
        }

        .tag-dr {
            background:#e2f5ed;
            color:#17805b;
        }

        .tag-admin {
            background:#fff1dc;
            color:#986018;
        }

        .board-table .empty {
            padding:48px 12px;
            color:#7a8fa3;
        }

        .bottom-bar {
            display:flex;
            justify-content:flex-end;
            margin-top:18px;
            gap:8px;
        }

        .pagination {
            display:flex;
            justify-content:center;
            align-items:center;
            gap:6px;
            flex-wrap:wrap;
            margin-top:22px;
        }

        .page {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-width:34px;
            height:34px;
            padding:0 8px;
            border:1px solid #d6e6f6;
            border-radius:7px;
            color:#486177;
            background:#fff;
        }

        .page.active {
            background:var(--grad);
            border-color:#2387dc;
            color:white;
            font-weight:700;
        }

        .page.disabled {
            color:#b6c4d1;
            background:#f8fafc;
        }

        .page:not(.disabled):hover {
            border-color:#76c8f2;
        }

        .breadcrumb {
            display:flex;
            align-items:center;
            gap:8px;
            color:var(--muted);
            font-size:13px;
            margin:0 0 15px;
        }

        .breadcrumb a {
            color:#007db9;
        }

        .article-head {
            background:var(--pale);
            border:1px solid var(--line);
            padding:22px;
            border-radius:10px;
        }

        .article-head h1 {
            font-size:25px;
            line-height:1.4;
            margin:12px 0 15px;
            overflow-wrap:anywhere;
        }

        .meta {
            display:flex;
            align-items:center;
            gap:9px 20px;
            flex-wrap:wrap;
            color:var(--muted);
            font-size:13px;
        }

        .meta strong {
            color:#354e67;
        }

        .article-body {
            min-height:210px;
            padding:28px 8px;
            line-height:1.85;
            white-space:pre-wrap;
            overflow-wrap:anywhere;
        }

        .vote-row {
            justify-content:center;
            margin:8px 0 26px;
        }

        .vote-btn {
            min-width:115px;
            min-height:42px;
        }

        .vote-btn.selected {
            background:#d0ebff;
            border-color:#41a9e8;
            color:#00629e;
            box-shadow:inset 0 0 0 1px #41a9e8;
        }

        .article-actions {
            display:flex;
            align-items:center;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:10px;
            padding-top:18px;
            border-top:1px solid var(--line);
        }

        .comments-card {
            margin-top:24px;
        }

        .section-title {
            margin:0 0 18px;
            font-size:19px;
        }

        .section-title span {
            color:#0085c2;
        }

        .comment {
            padding:17px 0;
            border-bottom:1px solid #e2edf7;
        }

        .comment:first-of-type {
            border-top:1px solid #e2edf7;
        }

        .comment-top {
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
        }

        .comment-top strong {
            color:#233e58;
        }

        .comment-time {
            color:var(--muted);
            font-size:12px;
        }

        .comment-body {
            margin:10px 0;
            white-space:pre-wrap;
            overflow-wrap:anywhere;
        }

        .comment-actions {
            justify-content:flex-end;
        }

        .comment-edit {
            margin-top:10px;
        }

        .comment-edit summary {
            cursor:pointer;
            color:#007db9;
            font-weight:700;
            font-size:13px;
            width:max-content;
        }

        .comment-edit form {
            margin-top:8px;
        }

        .comment-compose {
            margin-top:22px;
            background:#f5f9fc;
            padding:16px;
            border:1px solid var(--line);
            border-radius:10px;
        }

        .comment-compose label {
            display:block;
            font-weight:700;
            margin-bottom:8px;
        }

        textarea {
            display:block;
            width:100%;
            resize:vertical;
            line-height:1.65;
        }

        .comment-compose textarea,.comment-edit textarea {
            min-height:90px;
        }

        .form-actions {
            justify-content:flex-end;
            margin-top:12px;
        }

        .form-group {
            margin-bottom:23px;
        }

        .form-group label {
            display:block;
            font-weight:700;
            margin-bottom:8px;
        }

        .form-group input,.form-group textarea {
            width:100%;
        }

        .form-group textarea {
            min-height:300px;
        }

        .form-help,.muted {
            color:var(--muted);
            font-size:13px;
        }

        .form-help {
            margin:7px 0 0;
        }

        .form-footer {
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:12px;
            padding-top:20px;
            border-top:1px solid var(--line);
        }

        .alert {
            padding:12px 15px;
            border:1px solid #bfe2fa;
            background:#eff8ff;
            color:#285c7a;
            border-radius:8px;
            margin:0 0 17px;
        }

        .alert-error {
            background:#fff4f4;
            color:#a73535;
            border-color:#ffd2d2;
        }

        .alert-success {
            background:#edf9f4;
            color:#19704d;
            border-color:#c6ebd9;
        }

        .empty-comment {
            text-align:center;
            color:var(--muted);
            padding:20px;
        }

        .footer {
            text-align:center;
            color:#8294a7;
            font-size:12px;
            margin:28px 0;
        }

        .demo-strip {
            background:#e5f2fc;
            border-bottom:1px solid #cde4f7;
            padding:8px 16px;
            color:#32617f;
            font-size:12px;
        }

        .demo-strip .inner {
            max-width:1040px;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:8px;
            flex-wrap:wrap;
        }

        .demo-strip select {
            min-height:29px;
            padding:3px 7px;
            font-size:12px;
        }

        .inline-form {
            display:inline-flex;
            margin:0;
        }

        .auth-label {
            font-size:13px;
            color:#56748d;
        }

        .sr-only {
            position:absolute;
            width:1px;
            height:1px;
            padding:0;
            margin:-1px;
            overflow:hidden;
            clip:rect(0,0,0,0);
            white-space:nowrap;
            border:0;
        }

        @media(max-width:1100px) {
            .header-inner {
                padding:12px 18px;
                flex-wrap:wrap;
            }
            .container {
                margin:24px 16px 48px;
            }
        }

        @media(max-width:650px) {
            .card {
                padding:18px;
            }
            .main-nav {
                order:3;
                width:100%;
                gap:2px;
            }
            .main-nav a,.main-nav span {
                padding:8px 9px;
                font-size:12px;
            }
            .brand strong {
                font-size:15px;
            }
            .brand small {
                font-size:10px;
            }
            .search-form {
                width:100%;
            }
            .search-form input {
                flex:1;
                min-width:100px;
                width:130px;
            }
            .article-head {
                padding:16px;
            }
            .article-head h1 {
                font-size:21px;
            }
            .article-actions {
                align-items:flex-start;
            }
            .heading h1 {
                font-size:21px;
            }
        }
    </style>
</head>
<body>
<header th:replace="~{board/header :: header}"></header>
<main class="container">
    <div class="breadcrumb"><a th:href="@{/mmm/board/page}">자유게시판</a><span>›</span><span>게시글 상세</span></div>
    <section class="card" th:if="${board == null}"><p>존재하지 않거나 삭제된 게시글입니다.</p><a class="btn" th:href="@{/mmm/board/page}">목록으로</a></section>
    <th:block th:if="${board != null}" th:with="loggedIn=${viewerMemberNo != null}, owner=${viewerMemberNo != null and viewerMemberNo == board.memberNo}, admin=${isAdmin == true}">
        <article class="card">
            <p class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></p>
            <p class="alert alert-error" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>
            <div class="article-head">
                <span class="tag tag-notice" th:if="${board.boardType == 1}">공지</span><span class="tag tag-dr" th:if="${board.boardType == 2}">DR알람</span><span class="tag" th:if="${board.boardType == 3}">일반</span>
                <h1 th:text="${board.boardTitle}">게시글 제목</h1>
                <div class="meta"><span>작성자 <strong th:text="${board.nickname}">작성자</strong></span><span>작성일 <span th:text="${board.boardDate}"></span></span><span th:if="${board.boardModDate != null and board.boardModDate != board.boardDate}">수정일 <span th:text="${board.boardModDate}"></span></span><span>댓글 <strong th:text="${board.replyCount}">0</strong></span></div>
            </div>
            <div class="article-body" th:text="${board.boardCon}">게시글 내용</div>
            <div class="vote-row">
                <form method="post" class="inline-form" th:action="@{/mmm/board/vote}"><input type="hidden" name="boardNo" th:value="${board.boardNo}"><input type="hidden" name="voteType" value="LIKE"><button type="submit" class="btn btn-outline vote-btn" th:classappend="${myVote == 'LIKE' ? 'selected' : ''}" th:attr="aria-pressed=${myVote == 'LIKE'}" th:disabled="${!loggedIn or upCount == null or downCount == null}">추천 <strong th:text="${upCount != null ? upCount : '-'}">0</strong></button></form>
                <form method="post" class="inline-form" th:action="@{/mmm/board/vote}"><input type="hidden" name="boardNo" th:value="${board.boardNo}"><input type="hidden" name="voteType" value="DISLIKE"><button type="submit" class="btn btn-outline vote-btn" th:classappend="${myVote == 'DISLIKE' ? 'selected' : ''}" th:attr="aria-pressed=${myVote == 'DISLIKE'}" th:disabled="${!loggedIn or upCount == null or downCount == null}">비추천 <strong th:text="${downCount != null ? downCount : '-'}">0</strong></button></form>
            </div>
            <p class="muted" style="text-align:center" th:if="${upCount == null or downCount == null}">추천 집계 데이터를 연결하면 이용할 수 있습니다.</p>
            <div class="article-actions">
                <a class="btn btn-quiet" th:href="@{/mmm/board/page}">‹ 목록으로</a>
                <div class="actions">
                    <a class="btn btn-outline" th:if="${owner}" th:href="@{/mmm/board/edit(boardNo=${board.boardNo})}">수정</a>
                    <form class="inline-form" method="post" th:if="${owner}" th:action="@{/mmm/board/delete}" data-confirm="게시글을 삭제하시겠습니까?"><input type="hidden" name="boardNo" th:value="${board.boardNo}"><button class="btn btn-danger" type="submit">삭제</button></form>
                    <form class="inline-form" method="post" th:if="${admin}" th:action="@{/mmm/board/admin/delete}" data-confirm="관리자 권한으로 게시글을 숨김 처리하시겠습니까?"><input type="hidden" name="boardNo" th:value="${board.boardNo}"><button class="btn btn-danger" type="submit">관리자 상태 삭제</button></form>
                </div>
            </div>
        </article>
        <section class="card comments-card" id="comments">
            <h2 class="section-title">댓글 <span th:text="${board.replyCount}">0</span></h2>
            <p class="alert" th:if="${replyList == null}">댓글 조회 데이터를 연결하면 댓글을 확인할 수 있습니다.</p>
            <th:block th:if="${replyList != null}">
                <p class="empty-comment" th:if="${#lists.isEmpty(replyList)}">아직 등록된 댓글이 없습니다. 첫 댓글을 남겨보세요.</p>
                <article class="comment" th:each="reply : ${replyList}" th:with="replyOwner=${viewerMemberNo != null and viewerMemberNo == reply.memberNo}">
                    <div class="comment-top"><strong th:text="${reply.nickname}">작성자</strong><span class="comment-time"><span th:text="${reply.comDate}"></span><span th:if="${reply.comModDate != null and reply.comModDate != reply.comDate}"> · 수정됨</span></span></div>
                    <p class="comment-body" th:text="${reply.comCon}">댓글 내용</p>
                    <div class="comment-actions" th:if="${replyOwner}">
                        <form method="post" class="inline-form" th:action="@{/mmm/board/reply/delete}" data-confirm="댓글을 삭제하시겠습니까?"><input type="hidden" name="boardNo" th:value="${board.boardNo}"><input type="hidden" name="comNo" th:value="${reply.comNo}"><button type="submit" class="btn btn-danger btn-sm">삭제</button></form>
                    </div>
                    <details class="comment-edit" th:if="${replyOwner}"><summary>댓글 수정</summary><form method="post" th:action="@{/mmm/board/reply/update}"><input type="hidden" name="boardNo" th:value="${board.boardNo}"><input type="hidden" name="comNo" th:value="${reply.comNo}"><textarea name="comCon" aria-label="수정할 댓글" required th:text="${reply.comCon}"></textarea><div class="form-actions"><button type="submit" class="btn btn-primary btn-sm">수정 저장</button></div></form></details>
                </article>
                <form class="comment-compose" method="post" th:if="${loggedIn}" th:action="@{/mmm/board/reply/insert}"><input type="hidden" name="boardNo" th:value="${board.boardNo}"><label for="comCon">댓글 작성</label><textarea id="comCon" name="comCon" placeholder="서로 존중하는 댓글을 남겨주세요." required></textarea><div class="form-actions"><button type="submit" class="btn btn-primary">댓글 등록</button></div></form>
            </th:block>
            <p class="muted" th:if="${!loggedIn}">로그인 후 댓글 작성 및 추천에 참여할 수 있습니다.</p>
        </section>
    </th:block>
    <footer class="footer">RECHARGETECH · 스마트 에너지 리워드 커뮤니티</footer>
</main>
    <!-- 삭제 요청 전 확인 -->
    <script>
        // 삭제/관리자 숨김 요청 전 확인. 실제 권한 검사는 반드시 서버에서 수행.
        document.addEventListener('submit', function (event) {
            const message = event.target.dataset.confirm;
            if (message && !window.confirm(message)) event.preventDefault();
        });
    </script>
</body>
</html>
