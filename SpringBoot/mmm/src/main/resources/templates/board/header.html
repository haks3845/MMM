<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header">
    <div class="header-inner">
        <div class="brand">
            <svg class="brand-icon" viewBox="0 0 44 44" aria-hidden="true">
                <defs><linearGradient id="coin" x2=".7" y2="1"><stop stop-color="#fff4ad"/><stop offset=".48" stop-color="#e6ab36"/><stop offset="1" stop-color="#a46b12"/></linearGradient></defs>
                <circle cx="21" cy="23" r="16" fill="url(#coin)" stroke="#a97b26"/><circle cx="21" cy="23" r="12.5" fill="none" stroke="#fff2b2" stroke-width="1.3"/>
                <path d="M34 2 11 24l10-1L9 42 34 17l-12 2Z" fill="#087fc4" stroke="#05558e" stroke-width=".8"/><path d="m34 2-18 21 5 0-8 15 15-19-6 0Z" fill="#8edbff"/>
            </svg>
            <div><strong>RECHARGETECH</strong><small>재충전 + 재테크의 스마트한 결합</small></div>
        </div>
        <nav class="main-nav" aria-label="주 메뉴">
            <!-- 다른 팀원의 실제 URL이 확정되면 span을 a 태그로 교체 -->
            <span>홈</span><span>공지 및 DR알람</span>
            <a class="active" aria-current="page" th:href="@{/mmm/board/page}">자유게시판</a>
            <span>지도</span>
        </nav>
        <div class="auth">
            <span class="auth-label" th:if="${viewerMemberNo != null}" th:text="${viewerNickname != null ? viewerNickname + '님' : '로그인 상태'}">회원님</span>
            <th:block th:if="${viewerMemberNo == null}">
                <span class="btn btn-outline">로그인</span><span class="btn btn-primary">회원가입</span>
            </th:block>
        </div>
    </div>
</header>
</body>
</html>
