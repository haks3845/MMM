<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

<body class="bg-light">
	<div class="container">
		<main>
			<div class="py-5 text-center">
				<!-- <a href="/home"><img class="d-block mx-auto mb-4" src="/image/springboot.png" alt="" width="130"></a> -->
				<h2>Sign Up</h2>
			</div>

<!-- 			<div style="margin-left: 350px; margin-right: 350px;"> -->
				<div class="container" style="max-width: 600px;">
				<form class="needs-validation" action="/member/enroll" method="POST" onsubmit="return validateForm()">
					<div class="row g-3">
						<!-- 1. 아이디 -->
						<div class="col-12">
							<label for="userId" class="form-label">ID</label>
							<!-- <input type="text" class="form-control" id="id" name="id" placeholder="아이디 입력(5~20자, 알파벳 소문자나 숫자, 특수문자(-,_)로 구성)" minlength="5"  maxlength="20"  pattern="[a-z0-9\-_]{5,20}" title="5~20자의 영문 소문자, 숫자와 특수기호(_),(-)만 사용 가능합니다." oninput="this.value = this.value.replace(/[^a-z0-9\-_]/g, '')" required> -->
							<!-- oninput="this.value = this.value.replace(/\s/g, '')" : 띄어쓰기, 탭, 공백 제거 -->
							<!--  oninput="this.value = this.value.replace(/[^a-z0-9\-_]/g, '')"  : • 대괄호 안의 ^는 '부정(Not)'을 의미합니다. • 즉, 영문 소문자(a-z), 숫자(0-9), 하이픈(-), 언더바(_)를 제외한 모든 문자(공백, 한글, 대문자 등)를 입력 즉시 제거합니다. -->
							<input  type="text" class="form-control" id="userId" name="id" placeholder="아이디 입력(5~20자, 영문 소문자, 숫자, -, _)" minlength="5" maxlength="20" pattern="[a-z0-9_-]{5,20}" title="5~20자의 영문 소문자, 숫자와 특수기호(_),(-)만 사용 가능합니다." autocomplete="off" autocapitalize="none" spellcheck="false" required>
							<!--  oninput : 사용자가 글자를 입력할 때마다 즉시, pattern : 주로 폼 제출(submit) 시점, autocomplete="off" : 회원 가입 시 기존 아이디가 자동완성으로 뜨면 사용자가 혼란스러울 수 있으므로 off로 끔. -->
							<label id="idCheckResult">Please check your ID.</label>
						</div>
						
						<!-- 2. 비밀번호 -->
						<div class="col-12">
							<label for="pwd" class="form-label">PWD</label>
							<input type="password" class="form-control"  placeholder="비밀번호(8자 이상, 특수문자 한 개 포함)" minlength="8" maxlength="16" pattern="^(?=.*[^a-zA-Z0-9\s]).{8,}$" oninvalid="this.setCustomValidity('비밀번호는 8자 이상이며, 특수문자를 최소 1개 이상 포함해야 합니다.')" oninput="this.setCustomValidity(''); validatePassword();" id="pwd" name="pwd" required>
						</div>
							
						<!-- 3. 비밀번호 확인 -->
						<div class="col-12">
							<label for="pwdCheck" class="form-label">PWD Confirm</label>
							<input type="password" class="form-control" placeholder="비밀번호를 한 번 더 입력하세요" oninput="validatePassword()" id="pwdCheck" required>
							<!-- 비밀번호 확인 -->
							<!-- for="pwdConfirm" -> for="pwdCheck -->
						</div>
						
						<!-- 4. 이름 -->
						<div class="col-12">
							<label for="name" class="form-label">NAME</label>
							<input type="text" class="form-control" id="name" name="name" required>
						</div>
						
						<!-- 5. 닉네임 -->
						<div class="col-12">
							<label for="nickName" class="form-label">NICKNAME</label>
							<input type="text" class="form-control" id="nickName" name="nickName" required>
							<label id="nickNameCheckResult">Please check your NickName.</label>
						</div>
						
						<!-- 6. 이메일 -->
						<div class="col-12">
							<label for="emailId" class="form-label">EMAIL</label>
							<div class="input-group">
								<input type="text" class="form-control" id="emailId" name="emailId">
								<span class="input-group-text">@</span>
								<select name="emailDomain" style="width: 280px;">
									<option>naver.com</option>
									<option>gmail.com</option>
									<option>nate.com</option>
									<option>hanmail.net</option>
								</select>
							</div>
						</div>
						
						<!-- 7. 성별 -->
						<div class="col-12">
							<label class="form-label">GENDER</label><br>
							<input type="radio" id="man" name="gender" value="M" checked> MAN &nbsp;&nbsp;&nbsp;&nbsp;
							<input type="radio" id="woman" name="gender" value="F"> WOMAN
						</div>
						
						<!-- 8. 나이 -->
						<div class="col-12">
							<label for="age" class="form-label">AGE</label>
							<input type="number" class="form-control" id="age" name="age" min="0" max="100" value="0">
						</div>
						
						<!-- 9. 전화번호 -->
						<div class="col-12">
							<label for="phone" class="form-label">PHONE</label>
							<input type="text" class="form-control" id="phone" name="phone">
						</div>
						
						<!-- 10. 주소 -->
						<div class="col-12">
							<label for="address" class="form-label">ADDRESS</label>
							<input type="text" class="form-control" id="address" name="address">
						</div>
						
						<br><br><br><br><br>
						
						<button class="w-100 btn btn-primary btn-lg">SIGN UP</button>
					</div>
				</form>
			</div>
		</main>

		<footer class="my-5 pt-5 text-muted text-center text-small"></footer>

	<script>
	 // 중복 확인 통과 상태 저장 변수
    let isIdValid = false;
    let isNickValid = false;

    const userIdInput = document.getElementById('userId');
    const idCheckResult = document.getElementById('idCheckResult');
    const nickNameInput = document.getElementById('nickName');
    const nickNameCheckResult = document.getElementById('nickNameCheckResult');

    // 1. 아이디 실시간 형식 및 중복 확인 (입력할 때마다 자동 체크)
    const idRegex = /^[a-z0-9_-]{5,20}$/;

    userIdInput.addEventListener('input', function() {
        const idVal = this.value;
        isIdValid = false; // 수정 시 상태 초기화

        if (idVal === '') {
            idCheckResult.textContent = 'Please check your ID.';
            idCheckResult.style.color = 'black';
            return;
        }

        // 정규식 검사 먼저 수행
        if (!idRegex.test(idVal)) {
            idCheckResult.textContent = '5~20자의 영문 소문자, 숫자, (-), (_)만 사용 가능합니다.';
            idCheckResult.style.color = 'red';
            return;
        }

        // 형식이 맞으면 서버에 비동기(AJAX) 중복 확인 요청
        // (Spring Boot 컨트롤러 URL에 맞게 수정하세요)
        fetch('/member/checkId?id=' + encodeURIComponent(idVal))
            .then(response => response.text()) 	// 서버에서 "0"(사용가능) 또는 "1"(중복) 반환 가정
            .then(result => {
                if (result === '0') {
                    idCheckResult.textContent = '사용 가능한 아이디입니다.';
                    idCheckResult.style.color = 'green';
                    isIdValid = true;
                } else {
                    idCheckResult.textContent = '이미 사용 중인 아이디입니다.';
                    idCheckResult.style.color = 'red';
                    isIdValid = false;
                }
            })
            .catch(err => console.error('아이디 중복체크 오류:', err));
    });

    // 2. 닉네임 실시간 중복 확인
    nickNameInput.addEventListener('input', function() {
        const nickVal = this.value.trim();
        isNickValid = false;

        if (nickVal === '') {
            nickNameCheckResult.textContent = 'Please check your NickName.';
            nickNameCheckResult.style.color = 'black';
            return;
        }

        fetch('/member/checkNickName?nickName=' + encodeURIComponent(nickVal))
            .then(response => response.text())
            .then(result => {
                if (result === '0') {
                    nickNameCheckResult.textContent = '사용 가능한 닉네임입니다.';
                    nickNameCheckResult.style.color = 'green';
                    isNickValid = true;
                } else {
                    nickNameCheckResult.textContent = '이미 사용 중인 닉네임입니다.';
                    nickNameCheckResult.style.color = 'red';
                    isNickValid = false;
                }
            })
            .catch(err => console.error('닉네임 중복체크 오류:', err));
    });

    // 3. 비밀번호 일치 여부 실시간 검증 (HTML의 oninput="validatePassword()"와 연결)
    function validatePassword() {
        const pwd = document.getElementById('pwd');
        const pwdCheck = document.getElementById('pwdCheck');

        if (pwd.value !== pwdCheck.value) {
            pwdCheck.setCustomValidity('비밀번호가 일치하지 않습니다.');
        } else {
            pwdCheck.setCustomValidity(''); // 일치하면 에러 메시지 초기화
        }
    }

    // 4. 최종 폼 제출 시 검증 (HTML의 onsubmit="return validateForm()"와 연결)
    function validateForm() {
        if (!isIdValid) {
            alert('아이디를 확인해 주세요.');
            userIdInput.focus();
            return false;
        }
        if (!isNickValid) {
            alert('닉네임을 확인해 주세요.');
            nickNameInput.focus();
            return false;
        }
        return true; // 모든 검증 통과 시 /member/enroll 로 POST 전송
    }
