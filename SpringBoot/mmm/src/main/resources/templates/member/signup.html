	<script>
	 // 중복 확인 통과 상태 저장 변수
    let isIdValid = false;
    let isNickValid = false;

    const userIdInput = document.getElementById('userId');
    const idCheckResult = document.getElementById('idCheckResult');
    const nickNameInput = document.getElementById('nickName');
    const nickNameCheckResult = document.getElementById('nickNameCheckResult');

    // 1. 아이디 실시간 형식 및 중복 확인 (입력할 때마다 자동 체크)
    const idRegex = /^[a-z0-9_-]{5,20}$/;

    userIdInput.addEventListener('input', function() {
        const idVal = this.value;
        isIdValid = false; // 수정 시 상태 초기화

        if (idVal === '') {
            idCheckResult.textContent = 'Please check your ID.';
            idCheckResult.style.color = 'black';
            return;
        }

        // 정규식 검사 먼저 수행
        if (!idRegex.test(idVal)) {
            idCheckResult.textContent = '5~20자의 영문 소문자, 숫자, (-), (_)만 사용 가능합니다.';
            idCheckResult.style.color = 'red';
            return;
        }

        // 형식이 맞으면 서버에 비동기(AJAX) 중복 확인 요청
        // (Spring Boot 컨트롤러 URL에 맞게 수정하세요)
        fetch('/mmm/api/member/checkId?id=' + encodeURIComponent(idVal))
            .then(response => {
            	console.log('HTTP 상태코드:', response.status);
            	return response.text()
            }) 	// 서버에서 "0"(사용가능) 또는 "1"(중복) 반환 가정
            .then(result => {
            	console.log('서버 실제 응답값:', result); // 여기에 찍히는 값을 확인하세요!
            	
                if (result === '0') {
                    idCheckResult.textContent = '사용 가능한 아이디입니다.';
                    idCheckResult.style.color = 'green';
                    isIdValid = true;
                } else {
                    idCheckResult.textContent = '이미 사용 중인 아이디입니다.';
                    idCheckResult.style.color = 'red';
                    isIdValid = false;
                }
            })
            .catch(err => console.error('아이디 중복체크 오류:', err));
    });

    // 2. 닉네임 실시간 중복 확인
    nickNameInput.addEventListener('input', function() {
        const nickVal = this.value.trim();
        isNickValid = false;

        if (nickVal === '') {
            nickNameCheckResult.textContent = 'Please check your NickName.';
            nickNameCheckResult.style.color = 'black';
            return;
        }

        fetch('/mmm/api/member/checkNickName?nickName=' + encodeURIComponent(nickVal))
            .then(response => response.text())
            .then(result => {
                if (result === '0') {
                    nickNameCheckResult.textContent = '사용 가능한 닉네임입니다.';
                    nickNameCheckResult.style.color = 'green';
                    isNickValid = true;
                } else {
                    nickNameCheckResult.textContent = '이미 사용 중인 닉네임입니다.';
                    nickNameCheckResult.style.color = 'red';
                    isNickValid = false;
                }
            })
            .catch(err => console.error('닉네임 중복체크 오류:', err));
    });
    
    
    let isPwdValid = false; // 비밀번호 검증 상태 저장

    function validatePassword() {
        const pwd = document.getElementById('pwd').value;
        const pwdCheck = document.getElementById('pwdCheck').value;
        const pwdMsg = document.getElementById('pwdMsg');
        const pwdCheckMsg = document.getElementById('pwdCheckMsg');

        // 8~16자, 영문/숫자/특수문자 조합 (특수문자 최소 1개 필수)
        const pwdRegex = /^(?=.*[!@#$%^&*(),.?":{}|<>_\-+=\\/\[\]~`])[A-Za-z0-9!@#$%^&*(),.?":{}|<>_\-+=\\/\[\]~`]{8,16}$/;

        let isRuleOk = false;
        let isMatchOk = false;

        // 1) 비밀번호 규칙 검사
        if (pwd === '') {
            pwdMsg.textContent = '';
        } else if (!pwdRegex.test(pwd)) {
            pwdMsg.textContent = '8~16자의 영문, 숫자, 특수문자를 조합해 주세요. (특수문자 1개 이상 포함)';
            pwdMsg.className = 'form-text mt-1 text-danger';
        } else {
            pwdMsg.textContent = '사용 가능한 비밀번호입니다.';
            pwdMsg.className = 'form-text mt-1 text-success';
            isRuleOk = true;
        }

        // 2) 비밀번호 일치 여부 검사
        if (pwdCheck === '') {
            pwdCheckMsg.textContent = '';
        } else if (pwd !== pwdCheck) {
            pwdCheckMsg.textContent = '비밀번호가 일치하지 않습니다.';
            pwdCheckMsg.className = 'form-text mt-1 text-danger';
        } else {
            pwdCheckMsg.textContent = '비밀번호가 일치합니다.';
            pwdCheckMsg.className = 'form-text mt-1 text-success';
            isMatchOk = true;
        }

        // 둘 다 통과해야 true
        isPwdValid = isRuleOk && isMatchOk;
    }
    
    function toggleDirectInput(selectObj) {
        const directInput = document.getElementById('directDomain');

        if (selectObj.value === 'direct') {
            // '직접 입력' 선택 시 input 보이기 & name 속성 이동
            directInput.classList.remove('d-none');
            directInput.setAttribute('name', 'emailDomain');
            directInput.required = true;
            selectObj.removeAttribute('name');
            directInput.focus();
        } else {
            // 일반 도메인 선택 시 input 숨기기 & name 속성 복구
            directInput.classList.add('d-none');
            directInput.removeAttribute('name');
            directInput.required = false;
            directInput.value = '';
            selectObj.setAttribute('name', 'emailDomain');
        }
    }

    /* // 3. 비밀번호 일치 여부 실시간 검증 (HTML의 oninput="validatePassword()"와 연결)
    function validatePassword() {
        const pwd = document.getElementById('pwd');
        const pwdCheck = document.getElementById('pwdCheck');

        if (pwd.value !== pwdCheck.value) {
            pwdCheck.setCustomValidity('비밀번호가 일치하지 않습니다.');
        } else {
            pwdCheck.setCustomValidity(''); // 일치하면 에러 메시지 초기화
        }
    } */
    
 	// 1) 전체 동의 체크박스 클릭 시 하위 체크박스 일괄 제어
    function toggleAllTerms(allChk) {
        const checkboxes = document.querySelectorAll('.term-chk');
        checkboxes.forEach(chk => {
            chk.checked = allChk.checked;
        });
    }

    // 2) 개별 체크박스 클릭 시 전체 동의 체크박스 상태 동기화
    function checkIndividualTerm() {
        const total = document.querySelectorAll('.term-chk').length;
        const checked = document.querySelectorAll('.term-chk:checked').length;
        document.getElementById('agreeAll').checked = (total === checked);
    }
    
    // 4. 최종 폼 제출 시 검증 (HTML의 onsubmit="return validateForm()"와 연결)
    function validateForm() {
        if (!isIdValid) {
            alert('아이디를 확인해 주세요.');
            userIdInput.focus();
            return false;
        }
        if (!isNickValid) {
            alert('닉네임을 확인해 주세요.');
            nickNameInput.focus();
            return false;
        } 
        if (!isPwdValid) {
            alert('비밀번호를 확인해 주세요.');
            document.getElementById('pwd').focus();
            return false;
        }
     // ▼ 전화번호 필수 입력 검증 추가
        const phoneInput = document.getElementById('phone');
        const phoneVal = phoneInput.value.trim();
//      const phoneRegex = /^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$/;
// 		const phoneRegex = /^(01[0-9]|02|0[3-9][0-9])-?[0-9]{3,4}-?[0-9]{4}$/;		// 지역번호, 인터넷전화 포함

        const phoneRegex = /^(010-?[0-9]{4}-?[0-9]{4}|(02|0[3-6][1-5])-?[0-9]{3,4}-?[0-9]{4})$/;		// 010은 반드시 11자리 입력하게 변동
     // 1) 필수 입력 검증
        if (phoneVal === '') {
            alert('전화번호를 입력해 주세요.');
            phoneInput.focus();
            return false;
        }

        // 2) 형식 검증
        if (!phoneRegex.test(phoneVal)) {
            alert('올바른 전화번호 형식을 입력해 주세요.');
            phoneInput.focus();
            return false;
        }
        
        // 이메일 직접 입력 도메인 검증
        const domainSelect = document.getElementById('emailDomain');
        if (domainSelect.value === 'direct') {
            const directDomain = document.getElementById('directDomain');
            const domainRegex = /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/;

            if (!domainRegex.test(directDomain.value.trim())) {
                alert('올바른 이메일 도메인 형식을 입력해 주세요. (예: example.com)');
                directDomain.focus();
                return false;
            }
        }
//         if (phoneInput.value.trim() === '') {
//             alert('전화번호를 입력해 주세요.');
//             phoneInput.focus();
//             return false;
//         }

		 // 3) 필수 약관 동의 검증 (validateForm 내부에 추가)
	    const requiredTerms = document.querySelectorAll('.required-term');
	    for (let term of requiredTerms) {
	        if (!term.checked) {
	            alert('필수 약관에 모두 동의해 주세요.');
	            term.focus();
	            return false;
	        }
	    }
		
	    const emailIdVal = document.getElementById('emailId').value.trim();
	    const domainSelectVal = document.getElementById('emailDomain').value;
	    const domainVal = (domainSelectVal === 'direct') ? document.getElementById('directDomain').value.trim() : domainSelectVal;

	    document.getElementById('fullEmail').value = emailIdVal + '@' + domainVal;

        return true; // 모든 검증 통과 시 /member/enroll 로 POST 전송
    }
